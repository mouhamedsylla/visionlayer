id: node-package
name: Paquet Node (package.json)
tech: []
files: [package.json]
script: node-package.ts
rules: |
  % Ce que lance un paquet : sa source si elle existe, sinon le fichier que désigne main.
  pkg_src_at(D, C) :- pkg_src(D, C), present(C).
  pkg_has_src(D) :- pkg_src_at(D, _).
  pkg_runs(D, C) :- pkg_src_at(D, C).
  pkg_runs(D, C) :- pkg_main(D, C), present(C), not pkg_has_src(D).

  % Un script qui en appelle un autre lance ce que lance l'autre (S3 à S6) ; la boucle s'arrête sur ce qui est déjà connu.
  pkg_script(K, S, T) :- pkg_calls(K, S, S2), pkg_script(K, S2, T).
  pkg_script(K, S, T) :- pkg_calls_named(K, S, N, S2), pkg_name(K2, N), pkg_script(K2, S2, T).
  pkg_script(K, S, T) :- pkg_calls_file(K, S, K2, S2), pkg_script(K2, S2, T).

  % S7 : les paquets que désigne un filtre (motif, nom, dossier, -r), moins ceux qu'une exclusion de la même commande retire.
  pkg_skip(K, S, G, K2) :- pkg_calls_except(K, S, G, Kd, P), pkg_glob(K2, Kd, P).
  pkg_script(K, S, T) :- pkg_calls_glob(K, S, G, Kd, P, S2), pkg_glob(K2, Kd, P), K2 != K, not pkg_skip(K, S, G, K2), pkg_script(K2, S2, T).
