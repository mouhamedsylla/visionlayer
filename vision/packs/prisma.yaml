id: prisma
name: Prisma Client
tech: [prisma]
languages: [javascript, typescript]
# Pas de `when` : le client est souvent importé d'un module du projet (lib/prisma.ts), pas de @prisma/client.
script: prisma.ts
rules: |
  % Une écriture d'un champ, seulement pour un modèle déclaré dans un schéma Prisma (C1 à C3).
  entity_write(T, N, C, V, F, L) :- prisma_set(F, N, C, V, L), prisma_model(G, N), entity_def(T, _, N, G).
  entity_write(T, N, C, "", F, L) :- prisma_set_any(F, N, C, L), prisma_model(G, N), entity_def(T, _, N, G).
  entity_read(T, N, C, F, L) :- prisma_read(F, N, C, L), prisma_model(G, N), entity_def(T, _, N, G).
  entity_read(T, N, "*", F, L) :- prisma_read_whole(F, N, L), prisma_model(G, N), entity_def(T, _, N, G).
  entity_delete(T, N, "", F, L) :- prisma_delete(F, N, L), prisma_model(G, N), entity_def(T, _, N, G).
  % Le lien du code vers la table : ce que dessinent la carte et les déroulés.
  accesses(F, Op, T, N, L) :- prisma_op(F, Op, N, L), prisma_model(G, N), entity_def(T, _, N, G).
