# RYPHA — Politique de classification de risque des changements
#
# Référence gouvernance : governance/RYPHA_Governance_and_Standards_Framework.md §6
# Référence technique    : workflow/docs/architecture.md §4.2
#
# Source de vérité pour la classification LOW/MEDIUM/HIGH d'un changement,
# basée sur les CHEMINS DE FICHIERS touchés (pas sur un domaine métier nommé) —
# ça reste valide même quand le produit évolue.
#
# À copier/adapter dans chaque dépôt produit RYPHA (Nafar en premier).
# Ce fichier seul ne fait rien tourner — voir codeowners.template et
# branch-protection-setup.md pour l'application réelle sur GitHub.

version: 1

high_risk:
  description: >
    Touche l'accès, les secrets, les données personnelles, une migration
    de données, ou la configuration de production/infrastructure.
    Approbation humaine explicite OBLIGATOIRE avant merge — jamais de
    merge automatique, même si les tests passent.
  paths:
    - "**/auth/**"
    - "**/authz/**"
    - "**/payments/**"
    - "**/billing/**"
    - "**/migrations/**"
    - "**/infra/**"
    - "**/terraform/**"
    - "**/secrets/**"
    - "**/.env*"
    - "**/ci/deploy*"
    # Fichiers de déploiement et d'exposition (niveau Infrastructure, MVP7) :
    # ce sont exactement les sources que `vision infra` lit.
    - "**/docker-compose*.y*ml"
    - "**/compose*.y*ml"
    - "**/Dockerfile*"
    - "**/nginx*.conf"
    - "**/Caddyfile*"
    - "**/traefik*.y*ml"
    - "**/k8s/**"
    - "**/kubernetes/**"
    - "**/*.tf"
    - "**/.github/workflows/**"
    - "**/vercel.json"
    - "**/netlify.toml"
    # Firebase / Google Cloud (ADR 0011) : projets par environnement, déploiement,
    # et règles de sécurité des données (qui lit/écrit quoi).
    - "**/firebase.json"
    - "**/.firebaserc"
    - "**/cloudbuild*.y*ml"
    - "**/firestore.rules"
    - "**/storage.rules"
    - "**/database.rules.json"
  required_approvals: 1
  block_merge_until_approved: true

medium_risk:
  description: >
    Logique métier modifiée, ou nouvelle dépendance introduite, sans
    toucher accès/secrets/données/prod. Revue humaine requise, mais ne
    bloque pas le merge automatiquement — un rapport de changement suffit.
  paths:
    - "**/src/**"
    - "package.json"
    - "pnpm-lock.yaml"
    - "**/requirements.txt"
  required_approvals: 1
  block_merge_until_approved: false

low_risk:
  description: >
    Documentation, tests, refactor sans changement de comportement.
    La vérification automatique (tests + CI) suffit, aucune approbation
    humaine requise.
  paths:
    - "**/*.md"
    - "**/tests/**"
    - "**/docs/**"
  required_approvals: 0
  block_merge_until_approved: false
