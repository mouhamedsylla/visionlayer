events {}

http {
  upstream api {
    server api:3000;
  }

  server {
    listen 80;
    server_name reference.local;

    location /api/ {
      proxy_pass http://api/;
      proxy_set_header Host $host;
    }

    location /mail/ {
      # Boîte de réception de développement (MailHog).
      proxy_pass http://mailhog:8025/;
    }
  }
}
