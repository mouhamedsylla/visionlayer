events {}

http {
  upstream api {
    server api:3000;
  }

  server {
    listen 80;
    server_name reference.example.com;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name reference.example.com;
    ssl_certificate /etc/letsencrypt/live/reference.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reference.example.com/privkey.pem;

    location /api/ {
      proxy_pass http://api/;
      proxy_set_header Host $host;
    }
  }
}
