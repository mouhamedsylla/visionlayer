apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 6
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/acme/shop-api:2.1.0
          env:
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: SENTRY_DSN
